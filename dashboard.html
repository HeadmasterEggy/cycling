<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配送作战台 · Delivery Console</title>
<meta name="description" content="悉尼送外卖的单屏作战台 —— 取餐点、送达点、红灯堵点、区域好跑指数、落点之后的空驶，全部在一个页面上。">
<meta name="theme-color" content="#0a0a0c">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cycling Atlas">
<meta property="og:title" content="配送作战台 · Delivery Console">
<meta property="og:description" content="悉尼送外卖的单屏作战台 —— 取餐点、送达点、红灯堵点、区域好跑指数、落点之后的空驶，全部在一个页面上。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body data-page="dashboard">

<div class="dash">

  <!-- ================= top bar ================= -->
  <header class="dash-top">
    <div class="dash-brand">
      <b>配送作战台</b>
      <span>Delivery Console</span>
    </div>
    <div class="dash-stats" id="dashStats"></div>
    <!-- The console does not load app.js, so it has no shared top nav. The
         full ten-page bar plus nine stats does not fit one row anyway; these
         three are the trips that matter — its own narrative twin, the site
         root, and the everything-page. -->
    <nav class="dash-links">
      <a href="delivery.html" title="同样的数据，写成一篇可以读的分析">配送 ↗</a>
      <a href="index.html">总览 ↗</a>
      <a href="cycling-analysis.html">全景 ↗</a>
    </nav>
  </header>

  <!-- ================= map ================= -->
  <section class="dash-panel p-map">
    <div class="dash-head">
      <h2>热点地图</h2><em>Hotspots</em>
      <span class="dash-note" id="dashMapNote"></span>
    </div>
    <div class="dash-mapbar" id="dlvLayerChips">
      <button class="dlv-chip active" data-layer="pickups"><i class="dlv-dot dot-pickup"></i>取餐</button>
      <button class="dlv-chip active" data-layer="drops"><i class="dlv-dot dot-drop"></i>送达</button>
      <button class="dlv-chip" data-layer="lights"><i class="dlv-dot dot-light"></i>红灯</button>
      <button class="dlv-chip active" data-layer="zones"><i class="dlv-dot dot-zone"></i>区域</button>
      <button class="dlv-chip" data-layer="common"><i class="dlv-dot dot-common"></i>常走</button>
      <button class="dlv-chip" data-layer="hard"><i class="dlv-dot dot-hard"></i>难走</button>
      <span class="dash-sep"></span>
      <button class="dlv-reset" id="dlvReset">回到全图</button>
      <span class="dash-sep"></span>
      <span class="dash-mapbar-label">底色</span>
      <div class="dlv-metric-chips" id="dlvMetricChips"></div>
    </div>
    <div class="dash-mapwrap">
      <div id="dlvMap"></div>
      <div class="dlv-focus-bar dash-focus" id="dlvFocusBar" hidden></div>
    </div>
    <div class="dash-timebar">
      <button class="dlv-play" id="dlvPlay" aria-label="按时段播放">▶</button>
      <input type="range" id="dlvHour" min="-1" max="23" step="1" value="-1" aria-label="时段">
      <span class="dlv-time-label" id="dlvHourLabel">全天</span>
      <div class="dlv-map-legend" id="dlvMapLegend"></div>
    </div>
  </section>

  <!-- ================= zone ranking ================= -->
  <section class="dash-panel p-zones">
    <div class="dash-head">
      <h2>区域排行</h2><em>Zones</em>
      <span class="dash-note" id="dashZonesNote"></span>
    </div>
    <div class="dash-body" id="dashZones"></div>
  </section>

  <!-- ================= chaining ================= -->
  <section class="dash-panel p-chain">
    <div class="dash-head">
      <h2>落点之后</h2><em>After the drop</em>
    </div>
    <div class="dash-body" id="dashChain"></div>
  </section>

  <!-- ================= map side list ================= -->
  <section class="dash-panel p-list">
    <div class="dash-head">
      <h2 id="dlvPanelTitle">取餐点</h2><em>Stops</em>
      <span class="dash-note" id="dlvPanelCount">—</span>
    </div>
    <div class="dash-tabs" id="dlvPanelTabs">
      <button class="dlv-ptab active" data-list="pickups">取餐</button>
      <button class="dlv-ptab" data-list="drops">送达</button>
      <button class="dlv-ptab" data-list="lights">红灯</button>
      <button class="dlv-ptab" data-list="zones">区域</button>
      <button class="dlv-ptab" data-list="common">常走</button>
      <button class="dlv-ptab" data-list="hard">难走</button>
    </div>
    <div class="dash-body flush" id="dlvList"></div>
  </section>

  <!-- ================= hour x zone ================= -->
  <section class="dash-panel p-hours">
    <div class="dash-head">
      <h2>时段 × 区域</h2><em>Hour × zone</em>
      <span class="dash-note" id="dashHoursNote"></span>
    </div>
    <div class="dash-body" id="dashHours"></div>
  </section>

  <!-- ================= corridors ================= -->
  <section class="dash-panel p-roads">
    <div class="dash-head">
      <h2>最难走的路段</h2><em>Slowest corridors</em>
    </div>
    <div class="dash-body" id="dashRoads"></div>
  </section>

  <!-- ================= ground truth ================= -->
  <section class="dash-panel p-truth">
    <div class="dash-head">
      <h2>判得准不准</h2><em>Ground truth</em>
    </div>
    <div class="dash-body" id="dashTruth"></div>
  </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script src="assets/delivery-data.js"></script>
<script src="assets/delivery.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
